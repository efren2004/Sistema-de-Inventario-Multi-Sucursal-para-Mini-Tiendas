<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productos - Sistema de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">Gestión de Productos</h1>
                <div class="space-x-4">
                    <a href="index.html" class="text-blue-600 hover:text-blue-800 font-medium">Login</a>
                    <a href="dashboard.html" class="text-blue-600 hover:text-blue-800 font-medium">Dashboard</a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Formulario para crear producto -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Nuevo Producto</h2>
            <form id="productForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label for="codigo" class="block text-sm font-medium text-gray-700 mb-1">Código *</label>
                    <input type="text" id="codigo" name="codigo" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
                    <input type="text" id="nombre" name="nombre" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div class="md:col-span-2">
                    <label for="descripcion" class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                    <textarea id="descripcion" name="descripcion" rows="2"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent"></textarea>
                </div>
                <div>
                    <label for="precio" class="block text-sm font-medium text-gray-700 mb-1">Precio *</label>
                    <input type="number" id="precio" name="precio" step="0.01" min="0" required
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="categoria" class="block text-sm font-medium text-gray-700 mb-1">Categoría</label>
                    <input type="text" id="categoria" name="categoria"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                </div>
                <div>
                    <label for="unidad_medida" class="block text-sm font-medium text-gray-700 mb-1">Unidad de Medida</label>
                    <select id="unidad_medida" name="unidad_medida"
                        class="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-transparent">
                        <option value="UNIDAD">UNIDAD</option>
                        <option value="KILO">KILO</option>
                        <option value="LITRO">LITRO</option>
                        <option value="CAJA">CAJA</option>
                        <option value="PAQUETE">PAQUETE</option>
                    </select>
                </div>
                <div class="md:col-span-2">
                    <button type="submit"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-md transition duration-200">
                        Crear Producto
                    </button>
                </div>
            </form>
            <div id="formMessage" class="mt-4 hidden"></div>
        </div>

        <!-- Lista de productos -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-gray-800">Lista de Productos</h2>
                <button onclick="loadProducts()"
                    class="bg-gray-600 hover:bg-gray-700 text-white font-medium py-2 px-4 rounded-md transition duration-200">
                    Actualizar
                </button>
            </div>
            
            <div id="loading" class="text-center py-8 text-gray-500">Cargando productos...</div>
            <div id="errorMessage" class="hidden bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md mb-4"></div>
            <div id="productsList" class="hidden">
                <div class="overflow-x-auto">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Código</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Descripción</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Precio</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Categoría</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Unidad</th>
                            </tr>
                        </thead>
                        <tbody id="productsTableBody" class="bg-white divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script src="assets/scripts/api.js"></script>
    <script>
        const API_BASE = 'http://localhost:34384';

        // Cargar productos al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            loadProducts();
        });

        // Función para cargar productos
        async function loadProducts() {
            const loading = document.getElementById('loading');
            const errorDiv = document.getElementById('errorMessage');
            const productsList = document.getElementById('productsList');
            const tableBody = document.getElementById('productsTableBody');
            
            loading.classList.remove('hidden');
            errorDiv.classList.add('hidden');
            productsList.classList.add('hidden');
            
            try {
                const response = await fetch(`${API_BASE}/productos`);
                const data = await response.json();
                
                if (data.success) {
                    tableBody.innerHTML = '';
                    
                    if (data.data.length === 0) {
                        tableBody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No hay productos registrados</td></tr>';
                    } else {
                        data.data.forEach(product => {
                            const row = document.createElement('tr');
                            row.className = 'hover:bg-gray-50';
                            row.innerHTML = `
                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${product.codigo}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${product.nombre}</td>
                                <td class="px-6 py-4 text-sm text-gray-500">${product.descripcion || '-'}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">$${parseFloat(product.precio).toFixed(2)}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${product.categoria || '-'}</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${product.unidad_medida}</td>
                            `;
                            tableBody.appendChild(row);
                        });
                    }
                    
                    productsList.classList.remove('hidden');
                } else {
                    errorDiv.textContent = data.error || 'Error al cargar productos';
                    errorDiv.classList.remove('hidden');
                }
            } catch (error) {
                errorDiv.textContent = 'Error de conexión. Verifica que el servidor esté corriendo en http://localhost:34384';
                errorDiv.classList.remove('hidden');
                console.error('Error:', error);
            } finally {
                loading.classList.add('hidden');
            }
        }

        // Manejar envío del formulario
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                codigo: document.getElementById('codigo').value,
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                precio: parseFloat(document.getElementById('precio').value),
                categoria: document.getElementById('categoria').value,
                unidad_medida: document.getElementById('unidad_medida').value
            };
            
            const messageDiv = document.getElementById('formMessage');
            messageDiv.classList.add('hidden');
            
            try {
                const response = await fetch(`${API_BASE}/productos`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const data = await response.json();
                
                if (data.success) {
                    messageDiv.className = 'mt-4 bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-md';
                    messageDiv.textContent = 'Producto creado exitosamente';
                    messageDiv.classList.remove('hidden');
                    
                    // Limpiar formulario
                    document.getElementById('productForm').reset();
                    
                    // Recargar lista
                    loadProducts();
                } else {
                    messageDiv.className = 'mt-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md';
                    messageDiv.textContent = data.error || 'Error al crear producto';
                    messageDiv.classList.remove('hidden');
                }
            } catch (error) {
                messageDiv.className = 'mt-4 bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-md';
                messageDiv.textContent = 'Error de conexión. Verifica que el servidor esté corriendo.';
                messageDiv.classList.remove('hidden');
                console.error('Error:', error);
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Inventario</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Header -->
    <header class="bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">Dashboard</h1>
                <div class="space-x-4">
                    <a href="index.html" class="text-blue-600 hover:text-blue-800 font-medium">Login</a>
                    <a href="productos.html" class="text-blue-600 hover:text-blue-800 font-medium">Productos</a>
                </div>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Tarjetas de resumen -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-sm font-medium text-gray-500 mb-2">Total Productos</h3>
                <p id="totalProducts" class="text-3xl font-bold text-gray-900">-</p>
            </div>
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-sm font-medium text-gray-500 mb-2">Sucursales Activas</h3>
                <p id="totalSucursales" class="text-3xl font-bold text-gray-900">-</p>
            </div>
            <div class="bg-white rounded-lg shadow-md p-6">
                <h3 class="text-sm font-medium text-gray-500 mb-2">Transferencias Pendientes</h3>
                <p id="totalTransfers" class="text-3xl font-bold text-gray-900">-</p>
            </div>
        </div>

        <!-- Sección de productos recientes -->
        <div class="bg-white rounded-lg shadow-md p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Productos Recientes</h2>
            <div id="recentProducts" class="text-gray-500">Cargando...</div>
        </div>

        <!-- Sección de inventario -->
        <div class="bg-white rounded-lg shadow-md p-6">
            <h2 class="text-xl font-semibold text-gray-800 mb-4">Inventario por Sucursal</h2>
            <div id="inventoryData" class="text-gray-500">Cargando...</div>
        </div>
    </main>

    <script src="assets/scripts/api.js"></script>
    <script>
        const API_BASE = 'http://localhost:3000/api';

        // Cargar datos del dashboard
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboardData();
        });

        async function loadDashboardData() {
            try {
                // Cargar productos
                const productsRes = await fetch(`${API_BASE}/products`);
                const productsData = await productsRes.json();
                
                if (productsData.success) {
                    document.getElementById('totalProducts').textContent = productsData.count || 0;
                    
                    // Mostrar productos recientes
                    const recentDiv = document.getElementById('recentProducts');
                    if (productsData.data.length > 0) {
                        const recent = productsData.data.slice(0, 5);
                        recentDiv.innerHTML = `
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Código</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Nombre</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Precio</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200">
                                        ${recent.map(p => `
                                            <tr>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">${p.codigo}</td>
                                                <td class="px-6 py-4 text-sm">${p.nombre}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm">$${parseFloat(p.precio).toFixed(2)}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    } else {
                        recentDiv.textContent = 'No hay productos registrados';
                    }
                }

                // Cargar inventario
                const inventoryRes = await fetch(`${API_BASE}/inventory`);
                const inventoryData = await inventoryRes.json();
                
                if (inventoryData.success) {
                    const inventoryDiv = document.getElementById('inventoryData');
                    if (inventoryData.data.length > 0) {
                        inventoryDiv.innerHTML = `
                            <div class="overflow-x-auto">
                                <table class="min-w-full divide-y divide-gray-200">
                                    <thead class="bg-gray-50">
                                        <tr>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Sucursal</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Producto</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Cantidad</th>
                                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Mínimo</th>
                                        </tr>
                                    </thead>
                                    <tbody class="bg-white divide-y divide-gray-200">
                                        ${inventoryData.data.map(i => `
                                            <tr>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">${i.sucursal_nombre}</td>
                                                <td class="px-6 py-4 text-sm">${i.producto_nombre}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm">${parseFloat(i.cantidad).toFixed(2)}</td>
                                                <td class="px-6 py-4 whitespace-nowrap text-sm">${parseFloat(i.cantidad_minima).toFixed(2)}</td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                        `;
                    } else {
                        inventoryDiv.textContent = 'No hay inventario registrado';
                    }
                }

                // Cargar transferencias
                const transferRes = await fetch(`${API_BASE}/transfer`);
                const transferData = await transferRes.json();
                
                if (transferData.success) {
                    const pending = transferData.data.filter(t => t.estado === 'pendiente');
                    document.getElementById('totalTransfers').textContent = pending.length;
                }

            } catch (error) {
                console.error('Error al cargar datos:', error);
                document.getElementById('recentProducts').textContent = 'Error al cargar datos. Verifica que el servidor esté corriendo.';
                document.getElementById('inventoryData').textContent = 'Error al cargar datos. Verifica que el servidor esté corriendo.';
            }
        }
    </script>
</body>
</html>
